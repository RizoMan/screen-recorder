[package]
name = "rec-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure domain models, frame descriptors, audio mixer, ring buffers, config, and bilingual i18n for Screen Recorder"

[dependencies]
thiserror = "2.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[lints]
workspace = true
